<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kassenbuch umgezogen</title>
<script>
  // Das Kassenbuch ist am 01.09.2026 in den privaten Bereich (Org Tecko1985)
  // gewandert. GitHub Pages leitet nach einem Repo-Transfer NICHT um, deshalb
  // faengt dieser Ordner im Wurzel-Repo die alte Adresse ab.
  //
  // Zuerst den alten Service Worker mit Scope /kassenbuch/ abmelden: sonst
  // liefert die installierte PWA weiter die gecachte alte Fassung aus und
  // sieht nie ein Update. Danach pfadgleich weiterspringen; replace() statt
  // href, damit der Zurueck-Knopf nicht in eine Endlosschleife laeuft.
  (function () {
    var ziel = "https://tecko1985.github.io" + location.pathname + location.search + location.hash;
    function weiter() { location.replace(ziel); }
    if (!("serviceWorker" in navigator)) { weiter(); return; }
    var abgeschlossen = false;
    function einmal() { if (!abgeschlossen) { abgeschlossen = true; weiter(); } }
    setTimeout(einmal, 1500);
    navigator.serviceWorker.getRegistrations()
      .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
      .then(einmal, einmal);
  })();
</script>
<meta http-equiv="refresh" content="3; url=https://tecko1985.github.io/kassenbuch/">
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0;
         min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f4f6f8; color: #1f2933; padding: 24px; }
  .karte { background: #fff; border-radius: 12px; padding: 32px; max-width: 520px;
           box-shadow: 0 2px 16px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { line-height: 1.55; margin: 0 0 14px; }
  a.btn { display: inline-block; background: #1f6feb; color: #fff; text-decoration: none;
          padding: 10px 18px; border-radius: 8px; font-size: 14px; }
  code { background: #eef1f4; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
  <div class="karte">
    <h1>Das Kassenbuch ist umgezogen</h1>
    <p>Du wirst automatisch weitergeleitet. Passiert nichts, geht es hier weiter:</p>
    <p><a class="btn" href="https://tecko1985.github.io/kassenbuch/">Zum Kassenbuch</a></p>
    <p>Bitte aktualisiere dein Lesezeichen auf
       <code>tecko1985.github.io/kassenbuch/</code> &ndash; die alte Adresse bleibt
       nur als Weiterleitung bestehen.</p>
  </div>
</body>
